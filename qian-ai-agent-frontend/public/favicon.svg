<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- AI 字母 -->
  <text x="32" y="42" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-1">AI</text>
  <!-- 顶部星光点 -->
  <circle cx="48" cy="14" r="3" fill="url(#spark)" opacity="0.9"/>
  <circle cx="52" cy="22" r="1.5" fill="url(#spark)" opacity="0.6"/>
  <!-- 底部数据流 -->
  <rect x="14" y="50" width="6" height="2" rx="1" fill="#c4b5fd" opacity="0.8"/>
  <rect x="22" y="50" width="10" height="2" rx="1" fill="#c4b5fd"/>
  <rect x="34" y="50" width="16" height="2" rx="1" fill="#c4b5fd" opacity="0.6"/>
</svg>
