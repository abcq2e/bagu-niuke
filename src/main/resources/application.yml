spring:
  application:
    name: qian-ai-agent
  profiles:
    active: local
  # SSE 异步请求超时配置（5 分钟）
  mvc:
    async:
      request-timeout: 300000
  cloud:
    compatibility-verifier:
      enabled: false
    sentinel:
      transport:
        dashboard: 127.0.0.1:8080
        port: 8719
      eager: true
  # ===== MySQL 数据库配置（用户登录注册）=====
  datasource:
    url: jdbc:mysql://localhost:3307/yu_ai_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:your-local-mysql-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ===== Redis 缓存配置 =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
  # ===== Neo4j 图数据库配置 =====
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:your-local-neo4j-password}
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:your-deepseek-api-key}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: deepseek-chat
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:your-dashscope-api-key}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v2
    # ===== PGVector 向量数据库持久化 =====
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000
        initialize-schema: true
    # ===== MCP Client：把外部 MCP Server 的工具并进 Agent 工具集 =====
    # stdio 模式下 Spring AI 会按 mcp-servers.json 自动拉起 Server 子进程，无需手工启动
    # 不启用 MCP 时把 enabled 改成 false 即可，ToolRegistration 会自动跳过合并
    mcp:
      client:
        enabled: true
        name: qian-ai-agent
        version: 0.0.1
        type: SYNC
        request-timeout: 60s
        stdio:
          servers-configuration: classpath:mcp-servers.json

# PGVector 专属数据源配置
pgvector:
  datasource:
    url: jdbc:postgresql://localhost:5432/yu_ai_agent
    username: postgres
    password: ${PGVECTOR_PASSWORD:your-local-pgvector-password}
    driver-class-name: org.postgresql.Driver
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:your-local-neo4j-password}

server:
  port: 8123
  servlet:
    context-path: /api
  tomcat:
    connection-timeout: 300000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.qian.qianaiagent.controller

# Tavily 联网搜索 API
search-api:
  api-key: ${SEARCH_API_API_KEY:your-tavily-api-key}

logging:
  level:
    org.springframework.ai: DEBUG
    com.qian.qianaiagent.mapper: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# 文件存储路径与保留策略
# 🔴 root 刻意<b>不在此处配置</b>：它的默认值由 StorageProperties 的 Java 字段初始化器给出
#    （System.getProperty("user.dir")），与改造前逐字节一致，不需要迁移任何数据。
#    写成 root: ${user.dir} 会让默认值依赖占位符解析，解析失败时值会原样停留在
#    字符串 "${user.dir}"，成为一个极难排查的路径错误。
# 🔴 生产环境同样不要设 root：docker-compose.prod.yml 的 volume 挂载点
#    （/app/.quiz-cursor、/app/data/chat-memory 等）是按 user.dir 设计的，
#    改掉会让挂载点与实际读写路径分叉，数据会看似「凭空消失」。
qian:
  storage:
    chat-memory: data/chat-memory
    evals: data/evals
    ability-profiles: .ability-profiles
    quiz-cursor: .quiz-cursor
    review-cursor: .review-cursor
    retention:
      enabled: false            # 会删数据，默认关闭，必须显式开启
      max-conversations-per-user: 100
      max-age-days: 0           # 0 = 不按时间限制
      grace-period-minutes: 60  # 最近 60 分钟内修改过的会话永不清理
      sweep-interval-ms: 3600000

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-local-jwt-secret-at-least-256-bits-long}
  expiration: 604800000  # 7天

# 应用信息
info:
  app:
    name: qian-ai-agent
    version: 0.0.1
    description: AI 智能体面试官
