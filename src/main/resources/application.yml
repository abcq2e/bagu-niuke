spring:
  application:
    name: qian-ai-agent
  profiles:
    active: local
  # SSE 异步请求超时配置（5 分钟）
  mvc:
    async:
      request-timeout: 300000
  cloud:
    compatibility-verifier:
      enabled: false
    sentinel:
      transport:
        dashboard: 127.0.0.1:8080
        port: 8719
      eager: true
  # ===== MySQL 数据库配置（用户登录注册）=====
  datasource:
    url: jdbc:mysql://localhost:3307/yu_ai_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:your-local-mysql-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ===== Redis 缓存配置 =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
  # ===== Neo4j 图数据库配置 =====
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:your-local-neo4j-password}
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:your-deepseek-api-key}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: deepseek-chat
    dashscope:
      api-key: ${SPRING_AI_DASHSCOPE_API_KEY:your-dashscope-api-key}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v2
    # ===== PGVector 向量数据库持久化 =====
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000
        initialize-schema: true

# PGVector 专属数据源配置
pgvector:
  datasource:
    url: jdbc:postgresql://localhost:5432/yu_ai_agent
    username: postgres
    password: ${PGVECTOR_PASSWORD:your-local-pgvector-password}
    driver-class-name: org.postgresql.Driver
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:your-local-neo4j-password}

server:
  port: 8123
  servlet:
    context-path: /api
  tomcat:
    connection-timeout: 300000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.qian.qianaiagent.controller

# Tavily 联网搜索 API
search-api:
  api-key: ${SEARCH_API_API_KEY:your-tavily-api-key}

logging:
  level:
    org.springframework.ai: DEBUG
    com.qian.qianaiagent.mapper: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your-local-jwt-secret-at-least-256-bits-long}
  expiration: 604800000  # 7天

# 应用信息
info:
  app:
    name: qian-ai-agent
    version: 0.0.1
    description: AI 智能体面试官
